serverAddr = "<frps host or IP>"
serverPort = 7000
auth.method = "token"
auth.token = "REPLACE-WITH-YOUR-FRPS-TOKEN"
transport.tls.enable = true

# v4: tcp 透传(L4)。外层 TLS 由 cc-mysub 自己终结(身份=public_host)，frp 不可在边缘终结 TLS，
# 否则会破坏 helper↔cc-mysub 的外层 TLS。旧的 https/https2http(边缘终结 TLS)在 v4 作废。
[[proxies]]
name = "cc-mysub"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8788          # cc-mysub forward-proxy 监听端口
remotePort = 8788         # frps 暴露的端口 = 客户端 helper 的 --upstream 端口(ProxyPort)
                          # 必须与 config.json client.proxy_port 一致
