name: egress-audit
# 非 hermetic：跑真 claude latest（npm latest）。不挂 PR 阻塞，手动 / 周跑。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # 周一 06:00 UTC
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install system deps
        run: |
          sudo apt-get update -qq
          # openssl: audit CA + api.anthropic.com/evil.example leaves (stage_split).
          # ca-certificates: provides update-ca-certificates to install the audit CA
          # into the system trust store so cc-mysub's default transport trusts the
          # mock's api.anthropic.com cert (v4 audit wrinkle).
          sudo apt-get install -y -qq dnsmasq dnsutils iproute2 iptables openssl ca-certificates curl
          sudo systemctl stop dnsmasq 2>/dev/null || true   # 释放宿主 :53（沙箱内自起实例）
      - name: install claude (latest)
        run: npm i -g @anthropic-ai/claude-code
      - name: unit tests
        run: go test ./ci/egress/...
      - name: host-allowlist drift guard (static scan vs known-hosts baseline)
        # 静态扫描 latest claude 的硬编码遥测/控制面域名,diff 已审基线;出现基线外新候选即 fail,
        # 逼人复核分类(CC 遥测→收口进 internal/hosts;MCP/控制面/staging→补进基线)。
        # 非穷尽保证,补运行时 stage_split 的视野盲点(行为谱不全);定位见 ci/egress/hostscan/main.go。
        run: |
          go build -o /tmp/hostscan ./ci/egress/hostscan
          CLAUDE_BIN="$(readlink -f "$(command -v claude)")"
          echo "scanning: $CLAUDE_BIN"
          /tmp/hostscan "$CLAUDE_BIN" | sort -u > /tmp/scanned.txt
          grep -vE '^[[:space:]]*(#|$)' ci/egress/known-hosts.txt | sort -u > /tmp/baseline.txt
          NEW="$(comm -13 /tmp/baseline.txt /tmp/scanned.txt)"
          if [ -n "$NEW" ]; then
            echo "::error::telemetry/control-plane host(s) hardcoded in claude but absent from ci/egress/known-hosts.txt:"
            echo "$NEW"
            echo "Classify each — CC telemetry/IP-leaking → add to internal/hosts; MCP/control-plane/staging → add to baseline with a category comment."
            exit 1
          fi
          echo "drift guard: no new telemetry/control-plane candidates beyond baseline"
      - name: run egress audit (v4 split-egress coverage guard)
        run: sudo -E "$(command -v bash)" ci/egress/run.sh --split
