name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # gh release create 需写权限; 新仓库 GITHUB_TOKEN 默认只读会 403
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'   # 精确 patch pin → 同 tag 同 Go 版本产出同 sha256(可复现; 与 ci.yml 对齐)
      - name: vet + race test (发布守门 id 51 — 不出货未经 CI 验证的构建)
        # SHA256SUMS 只证「下载字节 = 上传字节」,对发布物本身正确性无保证。这里复跑 ci.yml 同口径的
        # vet+test,使 tag 触发的四平台二进制不会出自一个 vet/test 会拦下的构建(供应链不变量的实质)。
        run: |
          go vet ./...
          go test ./... -race -count=1
      - name: Cross-compile 4 platforms
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" \
              -o "dist/cc-mysub-$os-$arch" ./cmd/cc-mysub
          done
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum cc-mysub-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/cc-mysub-* dist/SHA256SUMS
          --title "${GITHUB_REF_NAME}" --notes "cc-mysub ${GITHUB_REF_NAME}"
